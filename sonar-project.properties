sonar.organization=idfoundry
sonar.projectKey=IDFoundry_SSFgo

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Test files are analysed as tests, not as source needing coverage.
# storage/storagetest is the exported contract test suite: test code that
# cannot use the _test.go suffix, because other modules import it.
sonar.exclusions=**/*_test.go,storage/storagetest/**,**/testdata/**

# Written by ci.yml: the core module's test job and the storage/sqlstore
# job (a separate module), then downloaded into place by the sonar job.
sonar.go.coverage.reportPaths=coverage.out,storage/sqlstore/coverage.out
sonar.go.tests.reportPaths=report.json,storage/sqlstore/report.json

# Tooling verified by running it, not by unit tests: the conformance
# harnesses and scripts (checked against the OIDF suite daily), the
# runnable example, and the throwaway certificates they use. The
# Transmitter harness lives in internal/conformance so that both modules'
# cmd/conformance-transmitter can run it.
sonar.coverage.exclusions=**/cmd/**,conformance/**,examples/**,internal/testcert/**,internal/conformance/**

# Findings reviewed and deliberately not fixed, each with its reason. The
# first five are false positives; the rest are rules this repository does
# not apply to test code and test tooling.
sonar.issue.ignore.multicriteria=rs256,sqlParams,ssrfRanges,sealedSubject,tokenSource,testComplexity,harnessComplexity,harnessStructs,harnessPkgComplexity,harnessPkgStructs

# go:S5542 "use a secure padding scheme": this is RS256 signature
# verification (RSASSA-PKCS1-v1_5), not encryption; CAEP Interoperability
# Profile §2.6 requires RS256.
sonar.issue.ignore.multicriteria.rs256.ruleKey=go:S5542
sonar.issue.ignore.multicriteria.rs256.resourceKey=internal/jose/rsa.go

# go:S2077 "dynamically formatted SQL": every value is a placeholder; what
# varies is only constant table names, the FOR UPDATE suffix and the
# number of placeholders.
sonar.issue.ignore.multicriteria.sqlParams.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.sqlParams.resourceKey=storage/sqlstore/**/*.go

# go:S1313 "hardcoded IP address": these are the ranges the SSRF-safe push
# client refuses to connect to.
sonar.issue.ignore.multicriteria.ssrfRanges.ruleKey=go:S1313
sonar.issue.ignore.multicriteria.ssrfRanges.resourceKey=transmitter/httpclient.go

# go:S1186 "empty function": the isSubject() methods are empty by design;
# they seal the Subject interface.
sonar.issue.ignore.multicriteria.sealedSubject.ruleKey=go:S1186
sonar.issue.ignore.multicriteria.sealedSubject.resourceKey=subject.go

# godre:S8196 "single-method interface name": receiver.TokenSource is
# frozen public API (COMPATIBILITY.md).
sonar.issue.ignore.multicriteria.tokenSource.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.tokenSource.resourceKey=receiver/token.go

# go:S3776 cognitive complexity: table-driven tests and fuzz targets read
# better whole than split to satisfy a metric.
sonar.issue.ignore.multicriteria.testComplexity.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.testComplexity.resourceKey=**/*_test.go

# The conformance harnesses are test tooling, verified by running them
# against the OIDF suite (as in FAPIgo).
sonar.issue.ignore.multicriteria.harnessComplexity.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.harnessComplexity.resourceKey=cmd/conformance-*/**/*.go
sonar.issue.ignore.multicriteria.harnessStructs.ruleKey=godre:S8205
sonar.issue.ignore.multicriteria.harnessStructs.resourceKey=cmd/conformance-*/**/*.go
sonar.issue.ignore.multicriteria.harnessPkgComplexity.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.harnessPkgComplexity.resourceKey=internal/conformance/**/*.go
sonar.issue.ignore.multicriteria.harnessPkgStructs.ruleKey=godre:S8205
sonar.issue.ignore.multicriteria.harnessPkgStructs.resourceKey=internal/conformance/**/*.go
