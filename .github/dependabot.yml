version: 2
updates:
  # The core module has no third-party dependencies (see go.mod), so this
  # finds nothing today; it is enabled so a dependency added later is
  # watched from the start.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # storage/sqlstore's database drivers (pgx, modernc.org/sqlite) and what
  # they pull in. Its requirement on the core module is left alone: a
  # replace directive points it at this repository, and the requirement
  # is raised deliberately, to a core release or commit sqlstore needs.
  - package-ecosystem: gomod
    directory: /storage/sqlstore
    schedule:
      interval: weekly
    ignore:
      - dependency-name: github.com/idfoundry/ssfgo
    groups:
      sqlstore:
        patterns: ["*"]
        update-types: [minor, patch]

  # The actions every workflow uses, all pinned by commit SHA with the
  # version in a comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The conformance suite's Python script dependencies, pinned with hashes
  # for conformance.yml.
  - package-ecosystem: pip
    directory: /conformance/scripts
    schedule:
      interval: weekly

  # The Keycloak image the interop test runs (interoptest/keycloak): a
  # never-built Dockerfile whose FROM line interop-keycloak.yml reads, so the image
  # is pinned (tag and digest) in that one place. A bump is how the test
  # moves to a new Keycloak release, so interop-keycloak.yml runs on its pull
  # request.
  - package-ecosystem: docker
    directory: /interoptest/keycloak
    schedule:
      interval: weekly

  # The easyssf interop test's Go module (interoptest/easyssf): the
  # easyssf-go release SSFgo's Transmitter is tested against. A bump is how
  # the test moves to a new release, so interop-easyssf.yml runs on its pull
  # request. Its requirement on this module is left alone: a replace
  # directive points it at the checkout.
  - package-ecosystem: gomod
    directory: /interoptest/easyssf
    schedule:
      interval: weekly
    ignore:
      - dependency-name: github.com/idfoundry/ssfgo

  # The easyssf interop test's Java program (interoptest/easyssf/java):
  # the easyssf-receiver release, the logging binding and the Maven
  # plugins, each pinned in its pom.xml. Test tooling only: nothing here
  # ships.
  - package-ecosystem: maven
    directory: /interoptest/easyssf/java
    schedule:
      interval: weekly
