name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          # The module has no dependencies, so there is no go.sum to key
          # the cache on.
          cache-dependency-path: go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -coverpkg=./... credits code exercised through other packages'
      # tests, e.g. caep and risc through internal/setcodec's spec vectors.
      - name: go test (race)
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  # storage/sqlstore is a separate module (it needs database drivers, the
  # core has no dependencies), tested against SQLite and PostgreSQL.
  sqlstore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ssfgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: storage/sqlstore
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: storage/sqlstore/go.mod
          check-latest: true
          cache-dependency-path: storage/sqlstore/go.sum

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race, SQLite and PostgreSQL)
        env:
          SSFGO_TEST_POSTGRES: postgres://postgres:ssfgo@localhost:5432/postgres?sslmode=disable
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          working-directory: storage/sqlstore
          args: --config ../../.golangci.yml

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # With no third-party dependencies, any finding is a standard-library
      # CVE fixed in a newer Go patch release, so scan with the latest Go
      # rather than go.mod's minimum.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0

      # storage/sqlstore's test-only drivers are third-party code.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          work-dir: storage/sqlstore

  # Workflow files are otherwise only checked when GitHub runs them — for
  # the scheduled conformance workflow, after merge.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # Every fuzz target must be scheduled in fuzz.yml, or it only ever
      # replays its seeds.
      - name: fuzz targets are all scheduled
        run: |
          missing=0
          while read -r target; do
            if ! grep -q "name: $target }" .github/workflows/fuzz.yml; then
              echo "::error::$target is not listed in .github/workflows/fuzz.yml"
              missing=1
            fi
          done < <(grep -rhoE '^func Fuzz[A-Za-z0-9_]+' --include='*_test.go' . | sed 's/^func //')
          exit "$missing"
