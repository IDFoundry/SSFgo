name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # COMPATIBILITY.md promises the two most recent Go releases: test the
    # minimum go.mod declares and the latest stable release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: minimum
            version-file: go.mod
          - go: stable
            version: stable
    name: test (Go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.version-file }}
          go-version: ${{ matrix.version }}
          check-latest: true
          # The module has no dependencies, so there is no go.sum to key
          # the cache on.
          cache-dependency-path: go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -coverpkg=./... credits code exercised through other packages'
      # tests, e.g. caep and risc through internal/setcodec's spec vectors.
      - name: go test (race)
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # One iteration of each benchmark, so they keep compiling and
      # working; timings from CI runners are too noisy to compare.
      - name: benchmarks (smoke)
        if: matrix.go == 'minimum'
        run: go test -run '^$' -bench . -benchtime 1x ./...

      # For SonarQube's test reporting (sonar.go.tests.reportPaths). A
      # separate run, so the step above keeps readable output.
      - name: go test (json, for SonarQube)
        if: matrix.go == 'minimum'
        run: go test -race ./... -json > report.json

      - name: upload results for SonarQube
        if: matrix.go == 'minimum'
        uses: actions/upload-artifact@v7
        with:
          name: sonar-core
          path: |
            coverage.out
            report.json
          retention-days: 1

  # storage/sqlstore is a separate module (it needs database drivers, the
  # core has no dependencies), tested against SQLite and PostgreSQL.
  sqlstore:
    runs-on: ubuntu-latest
    # COMPATIBILITY.md promises the two most recent Go releases: test the
    # minimum go.mod declares and the latest stable release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: minimum
            version-file: storage/sqlstore/go.mod
          - go: stable
            version: stable
    name: sqlstore (Go ${{ matrix.go }})
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # A throwaway test database on the runner: no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: storage/sqlstore
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.version-file }}
          go-version: ${{ matrix.version }}
          check-latest: true
          cache-dependency-path: storage/sqlstore/go.sum

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race, SQLite and PostgreSQL)
        env:
          SSFGO_TEST_POSTGRES: postgres://postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./...

      - name: go test (json, for SonarQube)
        if: matrix.go == 'minimum'
        env:
          SSFGO_TEST_POSTGRES: postgres://postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race ./... -json > report.json

      - name: benchmarks (smoke)
        if: matrix.go == 'minimum'
        env:
          SSFGO_TEST_POSTGRES: postgres://postgres@localhost:5432/postgres?sslmode=disable
        run: go test -run '^$' -bench . -benchtime 1x ./...

      - name: upload results for SonarQube
        if: matrix.go == 'minimum'
        uses: actions/upload-artifact@v7
        with:
          name: sonar-sqlstore
          # upload-artifact ignores the job's working-directory.
          path: |
            storage/sqlstore/coverage.out
            storage/sqlstore/report.json
          retention-days: 1

      # Every step above builds against the core in this checkout (go.mod's
      # replace). A user of the module gets the core version go.mod
      # requires, so check that is enough: drop the replace, build, and
      # fail if Go had to raise the requirement. Last, since it edits
      # go.mod.
      - name: builds against the declared core version
        if: matrix.go == 'stable'
        run: |
          want=$(go list -m -f '{{.Version}}' github.com/idfoundry/ssfgo)
          go mod edit -dropreplace=github.com/idfoundry/ssfgo
          GOFLAGS=-mod=mod go vet ./...
          got=$(go list -m -f '{{.Version}}' github.com/idfoundry/ssfgo)
          if [ "$want" != "$got" ]; then
            echo "::error::storage/sqlstore needs core $got, but go.mod requires $want; raise the requirement (see CONTRIBUTING.md)"
            exit 1
          fi

  # CI-based SonarQube Cloud analysis, fed the coverage and test results of
  # both modules (Automatic Analysis cannot run the tests). Configuration
  # is in sonar-project.properties.
  sonar:
    needs: [test, sqlstore]
    runs-on: ubuntu-latest
    # SONAR_TOKEN is not available to pull requests from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history, for SonarQube's blame and new-code detection.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: sonar-core

      - uses: actions/download-artifact@v8
        with:
          name: sonar-sqlstore
          path: storage/sqlstore

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Each example is its own module, built against this checkout through a
  # replace directive, so the jobs above never see it. This keeps each one
  # compiling and passing its end-to-end test as the library changes
  # underneath it — and, since an example's module path sits under the
  # library's, which Go would let import its internal packages, keeps it
  # to the public API an integrator has. A new example adds itself to the
  # matrix.
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [examples/session-revocation]
        go: [minimum, stable]
    name: ${{ matrix.module }} (Go ${{ matrix.go }})
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go == 'minimum' && format('{0}/go.mod', matrix.module) || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: public API only
        run: |
          internal=$(go list -f '{{join .Imports "\n"}}{{"\n"}}{{join .TestImports "\n"}}{{"\n"}}{{join .XTestImports "\n"}}' ./... | grep '^github.com/idfoundry/ssfgo/internal' | sort -u || true)
          if [ -n "$internal" ]; then
            echo "::error::examples must use SSFgo's public API only; found: $internal"
            exit 1
          fi

      - name: go test (race)
        run: go test -race ./...

  # The Go code in GETTING_STARTED.md and docs/guides, built against this
  # checkout so the documentation cannot drift from the API it describes.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: storage/sqlstore/go.sum

      - name: documentation code builds
        run: go run ./internal/doccheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          working-directory: storage/sqlstore
          args: --config ../../.golangci.yml

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          working-directory: examples/session-revocation
          args: --config ../../.golangci.yml

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # With no third-party dependencies, any finding is a standard-library
      # CVE fixed in a newer Go patch release, so scan with the latest Go
      # rather than go.mod's minimum. The toolchain comes from go.dev's
      # release list, as setup-go's lags new releases by up to days.
      # storage/sqlstore's test-only drivers are third-party code.
      - name: govulncheck
        run: |
          GOTOOLCHAIN=$(curl -fsS 'https://go.dev/dl/?mode=json' | jq -r '.[0].version')
          export GOTOOLCHAIN
          go version
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          cd storage/sqlstore
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Workflow files are otherwise only checked when GitHub runs them — for
  # the scheduled conformance workflow, after merge.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # Every fuzz target must be scheduled in fuzz.yml, or it only ever
      # replays its seeds.
      - name: fuzz targets are all scheduled
        run: |
          missing=0
          while read -r target; do
            if ! grep -q "name: $target }" .github/workflows/fuzz.yml; then
              echo "::error::$target is not listed in .github/workflows/fuzz.yml"
              missing=1
            fi
          done < <(grep -rhoE '^func Fuzz[A-Za-z0-9_]+' --include='*_test.go' . | sed 's/^func //')
          exit "$missing"
