name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          # The module has no dependencies, so there is no go.sum to key
          # the cache on.
          cache-dependency-path: go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -coverpkg=./... credits code exercised through other packages'
      # tests, e.g. caep and risc through internal/setcodec's spec vectors.
      - name: go test (race)
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # With no third-party dependencies, any finding is a standard-library
      # CVE fixed in a newer Go patch release, so scan with the latest Go
      # rather than go.mod's minimum.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0

  # Workflow files are otherwise only checked when GitHub runs them — for
  # the scheduled conformance workflow, after merge.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # Every fuzz target must be scheduled in fuzz.yml, or it only ever
      # replays its seeds.
      - name: fuzz targets are all scheduled
        run: |
          missing=0
          for target in $(grep -rhoE '^func Fuzz[A-Za-z0-9_]+' --include='*_test.go' . | sed 's/^func //'); do
            if ! grep -q "name: $target }" .github/workflows/fuzz.yml; then
              echo "::error::$target is not listed in .github/workflows/fuzz.yml"
              missing=1
            fi
          done
          exit $missing
