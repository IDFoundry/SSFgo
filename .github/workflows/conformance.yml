name: SSF Conformance

# The full OIDF conformance matrix takes about half an hour, so it runs
# daily and on demand rather than on every pull request.
on:
  schedule:
    - cron: '0 6 * * *' # daily, 6am UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The job runs the OIDF suite's newest release, unpinned, as an early
    # warning of suite changes. So it keeps no Git credentials for that code
    # to use, and caches no Go build state another workflow could restore.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # The suite publishes an image for each release; its "latest" image
      # is not rebuilt with them. Run the newest release's image, with the
      # scripts from the same release.
      - name: Find the suite's newest release
        id: suite
        run: |
          tag=$(git ls-remote --tags --refs https://gitlab.com/openid/conformance-suite.git 'release-v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          if [ -z "$tag" ]; then echo "no suite release found" >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "OIDF conformance suite: $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Clone OIDF conformance suite
        env:
          SUITE_TAG: ${{ steps.suite.outputs.tag }}
        run: git clone --depth 1 --branch "$SUITE_TAG" https://gitlab.com/openid/conformance-suite.git /tmp/conformance-suite

      # Pinned and hash-checked here rather than taken from the suite's own
      # unpinned requirements.txt.
      - name: Install suite script dependencies
        run: "pip install --require-hashes --only-binary :all: -r conformance/scripts/requirements.txt"

      - name: Bring up OIDF conformance suite
        working-directory: /tmp/conformance-suite
        env:
          IMAGE_TAG: ${{ steps.suite.outputs.tag }}
        run: docker compose -f docker-compose-prebuilt.yml -f "$GITHUB_WORKSPACE/conformance/scripts/suite-host-gateway.override.yml" up -d

      - name: Run the conformance matrix
        env:
          CONFORMANCE_SUITE_CHECKOUT: /tmp/conformance-suite
          PYTHON: python3
          WORKDIR: ${{ runner.temp }}/conformance-results
          # The Transmitter matrix also runs on storage/sqlstore (SQLite).
          STORES: memory sqlite
        run: ./conformance/scripts/run-all.sh

      - name: Add summary to job summary
        if: always()
        run: |
          { echo '```'; cat "${{ runner.temp }}/conformance-results/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance-results
          retention-days: 14

      - name: Tear down suite containers
        if: always()
        working-directory: /tmp/conformance-suite
        env:
          IMAGE_TAG: ${{ steps.suite.outputs.tag }}
        run: docker compose -f docker-compose-prebuilt.yml down -v || true
