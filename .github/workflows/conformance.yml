name: SSF Conformance

# The full OIDF conformance matrix takes about half an hour, so it runs
# daily and on demand rather than on every pull request.
on:
  schedule:
    - cron: '0 6 * * *' # daily, 6am UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            go.mod
            storage/sqlstore/go.sum

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Clone OIDF conformance suite
        run: git clone --depth 1 https://gitlab.com/openid/conformance-suite.git /tmp/conformance-suite

      # Pinned and hash-checked here rather than taken from the suite's own
      # unpinned requirements.txt.
      - name: Install suite script dependencies
        run: "pip install --require-hashes --only-binary :all: -r conformance/scripts/requirements.txt"

      - name: Bring up OIDF conformance suite
        working-directory: /tmp/conformance-suite
        run: docker compose -f docker-compose-prebuilt.yml -f "$GITHUB_WORKSPACE/conformance/scripts/suite-host-gateway.override.yml" up -d

      - name: Run the conformance matrix
        env:
          CONFORMANCE_SUITE_CHECKOUT: /tmp/conformance-suite
          PYTHON: python3
          WORKDIR: ${{ runner.temp }}/conformance-results
          # The Transmitter matrix also runs on storage/sqlstore (SQLite).
          STORES: memory sqlite
        run: ./conformance/scripts/run-all.sh

      - name: Add summary to job summary
        if: always()
        run: |
          { echo '```'; cat "${{ runner.temp }}/conformance-results/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance-results
          retention-days: 14

      - name: Tear down suite containers
        if: always()
        working-directory: /tmp/conformance-suite
        run: docker compose -f docker-compose-prebuilt.yml down -v || true
