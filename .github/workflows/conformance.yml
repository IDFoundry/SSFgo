name: SSF Conformance

# The full OIDF conformance matrix takes about half an hour, so it runs
# daily and on demand rather than on every pull request.
on:
  schedule:
    - cron: '0 6 * * *' # daily, 6am UTC
  workflow_dispatch: {}

permissions:
  contents: read

# The suite release the matrix runs, pinned so that only reviewed suite
# code runs here: GitHub's cache is shared by every workflow on main, and
# pull requests restore from it, so code this job runs could poison what
# ci.yml restores. conformance/scripts/suite-pinned.override.yml pins the
# release's images; move all three together. The newer-suite job says
# when a newer release is out.
env:
  SUITE_TAG: release-v5.3.3
  SUITE_COMMIT: 7d420f716e49d44f8a6b04f0a3e240ad6d68ab55

jobs:
  newer-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a newer suite release
        run: |
          newest=$(git ls-remote --tags --refs https://gitlab.com/openid/conformance-suite.git 'release-v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          if [ -z "$newest" ]; then echo "no suite release found" >&2; exit 1; fi
          echo "OIDF conformance suite: pinned $SUITE_TAG, newest $newest" >> "$GITHUB_STEP_SUMMARY"
          if [ "$newest" != "$SUITE_TAG" ]; then
            echo "::error::The OIDF conformance suite released $newest; the matrix runs $SUITE_TAG. Review the release, then move the pin in conformance.yml and suite-pinned.override.yml."
            exit 1
          fi

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Even pinned, the suite's code keeps no Git credentials to use, and
    # the job saves no cache of its own.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Clone OIDF conformance suite
        run: |
          git clone --depth 1 --branch "$SUITE_TAG" https://gitlab.com/openid/conformance-suite.git /tmp/conformance-suite
          got=$(git -C /tmp/conformance-suite rev-parse HEAD)
          if [ "$got" != "$SUITE_COMMIT" ]; then
            echo "::error::suite tag $SUITE_TAG is at $got, not the pinned $SUITE_COMMIT"
            exit 1
          fi
          echo "OIDF conformance suite: $SUITE_TAG ($SUITE_COMMIT)" >> "$GITHUB_STEP_SUMMARY"

      # Pinned and hash-checked here rather than taken from the suite's own
      # unpinned requirements.txt.
      - name: Install suite script dependencies
        run: "pip install --require-hashes --only-binary :all: -r conformance/scripts/requirements.txt"

      - name: Bring up OIDF conformance suite
        working-directory: /tmp/conformance-suite
        run: >-
          docker compose -f docker-compose-prebuilt.yml
          -f "$GITHUB_WORKSPACE/conformance/scripts/suite-host-gateway.override.yml"
          -f "$GITHUB_WORKSPACE/conformance/scripts/suite-pinned.override.yml"
          up -d

      - name: Run the conformance matrix
        env:
          CONFORMANCE_SUITE_CHECKOUT: /tmp/conformance-suite
          PYTHON: python3
          WORKDIR: ${{ runner.temp }}/conformance-results
          # The Transmitter matrix also runs on storage/sqlstore (SQLite).
          STORES: memory sqlite
        run: ./conformance/scripts/run-all.sh

      - name: Add summary to job summary
        if: always()
        run: |
          { echo '```'; cat "${{ runner.temp }}/conformance-results/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance-results
          retention-days: 14

      - name: Tear down suite containers
        if: always()
        working-directory: /tmp/conformance-suite
        run: >-
          docker compose -f docker-compose-prebuilt.yml
          -f "$GITHUB_WORKSPACE/conformance/scripts/suite-pinned.override.yml"
          down -v || true
