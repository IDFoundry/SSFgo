name: Interop

# Runs the Receiver against deployed Transmitters — for now Keycloak's,
# whose SSF support is experimental — so it runs weekly, on demand, and on
# pull requests that change these tests, rather than gating every pull
# request on another project's preview feature.
on:
  schedule:
    - cron: '0 7 * * 1' # Mondays, 7am UTC
  workflow_dispatch: {}
  pull_request:
    paths:
      - interop/**
      - .github/workflows/interop.yml

permissions:
  contents: read

jobs:
  keycloak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned by digest, so the tag cannot be moved under the test.
      KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          # The job runs a third-party image alongside the build, so it
          # caches no Go build state another workflow could restore.
          cache: false

      # The Receiver requires an https issuer, so Keycloak serves https
      # with a self-signed certificate the test trusts.
      - name: Generate a certificate
        run: |
          mkdir -p "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$RUNNER_TEMP/certs/tls.key" -out "$RUNNER_TEMP/certs/tls.crt"
          chmod 644 "$RUNNER_TEMP/certs/tls.key"

      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 8443:8443 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$RUNNER_TEMP/certs:/opt/keycloak/conf/certs:ro" \
            "$KEYCLOAK_IMAGE" start-dev --features=ssf \
            --https-certificate-file=/opt/keycloak/conf/certs/tls.crt \
            --https-certificate-key-file=/opt/keycloak/conf/certs/tls.key \
            --hostname=https://localhost:8443 --http-enabled=false
          for _ in $(seq 120); do
            if curl -fsS --cacert "$RUNNER_TEMP/certs/tls.crt" \
              https://localhost:8443/realms/master/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs keycloak
          exit 1

      - name: Run the interop test
        env:
          SSFGO_INTEROP_KEYCLOAK: https://localhost:8443
          SSFGO_INTEROP_KEYCLOAK_CA: ${{ runner.temp }}/certs/tls.crt
        run: go test -count=1 -v -run TestKeycloak ./interop/keycloak

      - name: Keycloak logs
        if: failure()
        run: docker logs keycloak 2>&1 | tail -300
