version: "2"

linters:
  default: standard
  enable:
    - gosec
    - bodyclose
  exclusions:
    generated: strict
    rules:
      # Not real findings in tests: gosec flags fixture strings that look
      # like credentials and the deliberately weak RSA keys the "reject
      # weak keys" tests generate; errcheck and bodyclose flag httptest
      # plumbing.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - bodyclose
      # Configuration errors begin with the Go field they name, which is
      # capitalised: "Audience is required" (design rule 2).
      - path: (receiver/config|transmitter/config|revocation/revocation|internal/assurance/assurance)\.go
        linters:
          - staticcheck
        text: ST1005

formatters:
  enable:
    - gofmt

run:
  timeout: 5m
